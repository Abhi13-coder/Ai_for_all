name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # If you've added a GOOGLE_SERVICES_JSON repo secret (base64 of your
      # Firebase google-services.json), this decodes it into app/. If the
      # secret isn't set yet, this step is skipped and the build still
      # succeeds — Firebase just isn't wired up until you add it.
      - name: Write google-services.json (if configured)
        if: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

      # Uses gradle/actions/setup-gradle, which installs Gradle itself —
      # no committed gradlew/gradle-wrapper.jar binary required.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-for-all-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
