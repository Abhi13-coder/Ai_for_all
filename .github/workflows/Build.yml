name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate Gradle project root
        id: locate
        run: |
          FILE=$(find . -maxdepth 4 -name "settings.gradle.kts" | head -n 1)
          if [ -z "$FILE" ]; then
            echo "Could not find settings.gradle.kts anywhere in the repo!"
            find . -maxdepth 4
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Found project root at: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Write google-services.json (if configured)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > AIForAll/app/google-services.json
            echo "google-services.json written."
          else
            echo "No GOOGLE_SERVICES_JSON secret set yet — skipping."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-for-all-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
